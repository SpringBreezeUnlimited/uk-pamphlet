<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#18344d">
  <title>挨拶文・写真を更新｜宇工祭</title>
  <style>
    :root{--ink:#18344d;--purple:#443088;--paper:#f4ecd9;--muted:#526577}
    *{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.6}
    main{width:min(100%,850px);min-height:100dvh;margin:auto;padding:32px 18px 54px;background:#fffdf8}.eyebrow{margin:0 0 5px;color:var(--purple);font-size:13px;font-weight:800}h1{margin:0 0 8px;font-size:clamp(25px,5vw,34px)}h2{margin:0 0 15px;font-size:20px}.lead{color:var(--muted);margin:0 0 22px}.status{padding:13px 15px;border-left:4px solid var(--purple);background:#f0ecf7;border-radius:5px;margin:0 0 22px}.status.error{border-color:#b13838;background:#fff1ee}.card{background:#fff;border:1px solid #d7c7aa;border-radius:10px;padding:22px;margin-bottom:20px;box-shadow:2px 3px 0 #d7c7aa}label{display:block;font-weight:700;margin:0 0 14px}input:not([type=file]),textarea{display:block;width:100%;margin-top:6px;padding:10px;border:1.5px solid var(--ink);border-radius:5px;font:inherit}textarea{min-height:180px;resize:vertical}input[type=file]{display:block;margin-top:7px;max-width:100%}.preview{display:block;width:120px;height:160px;object-fit:cover;border:2px solid var(--ink);border-radius:4px;margin:8px 0 10px}.hint{font-size:13px;color:var(--muted)}button{min-height:44px;padding:9px 16px;border:2px solid var(--purple);border-radius:5px;background:var(--purple);color:#fff;font:700 15px inherit;cursor:pointer}button.secondary{background:#fff;color:var(--purple)}button:disabled{opacity:.6;cursor:wait}a{color:var(--purple)}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #397cad;outline-offset:3px}.actions{display:flex;flex-wrap:wrap;gap:10px}.back{display:inline-block;margin-top:12px;font-weight:700}
  </style>
</head>
<body>
<main>
  <p class="eyebrow">宇工祭 · 生徒会役員用</p>
  <h1>挨拶文・写真を更新</h1>
  <p class="lead">それぞれの挨拶を編集し、個別に保存します。写真は自動で縮小されます。</p>
  <p id="status" class="status" role="status" aria-live="polite">管理者権限を確認しています…</p>
  <section id="editor" hidden>
    <form class="card" data-person="principal"><h2>校長</h2><label>氏名<input name="name" maxlength="80" required></label><label>挨拶文<textarea name="message" maxlength="5000" required></textarea></label><label>写真<input name="photo" type="file" accept="image/*"></label><img class="preview" src="no-image.svg" alt="校長の写真プレビュー"><p class="hint">写真を選ぶとプレビューに表示されます。変更は保存ボタンを押すまで公開されません。</p><div class="actions"><button class="secondary remove-photo" type="button">写真を削除</button><button type="submit">校長の挨拶を保存</button></div></form>
    <form class="card" data-person="fulltime"><h2>全日制生徒会長</h2><label>氏名<input name="name" maxlength="80" required></label><label>挨拶文<textarea name="message" maxlength="5000" required></textarea></label><label>写真<input name="photo" type="file" accept="image/*"></label><img class="preview" src="no-image.svg" alt="全日制生徒会長の写真プレビュー"><p class="hint">写真を選ぶとプレビューに表示されます。変更は保存ボタンを押すまで公開されません。</p><div class="actions"><button class="secondary remove-photo" type="button">写真を削除</button><button type="submit">全日制生徒会長の挨拶を保存</button></div></form>
    <form class="card" data-person="parttime"><h2>定時制生徒会長</h2><label>氏名<input name="name" maxlength="80" required></label><label>挨拶文<textarea name="message" maxlength="5000" required></textarea></label><label>写真<input name="photo" type="file" accept="image/*"></label><img class="preview" src="no-image.svg" alt="定時制生徒会長の写真プレビュー"><p class="hint">写真を選ぶとプレビューに表示されます。変更は保存ボタンを押すまで公開されません。</p><div class="actions"><button class="secondary remove-photo" type="button">写真を削除</button><button type="submit">定時制生徒会長の挨拶を保存</button></div></form>
  </section>
  <a class="back" href="admin.html">← 管理者トップに戻る</a>
</main>
<script type="module">
  import("./greeting-admin.js").catch(() => {
    const status = document.getElementById("status");
    status.textContent = "管理画面を読み込めません。通信を確認して再読み込みしてください。";
    status.classList.add("error");
  });
</script>
</body>
</html>
