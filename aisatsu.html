<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#18344d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ごあいさつ｜宇工祭2026</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="announcement.css">
<style>
  :root{--ink:#18344d;--blue:#306486;--orange:#e8793b;--paper:#f4ecd9;--cream:#fffdf8;--line:#d7c7aa;--muted:#617384}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
  body{background-image:linear-gradient(rgba(97,115,132,.09) 1px,transparent 1px);background-size:100% 30px}
  #app{width:min(100%,680px);min-height:100dvh;margin:auto;background:rgba(255,253,248,.8);border-inline:1px solid rgba(215,199,170,.55)}
  .banner{position:relative;text-align:center;padding:calc(18px + env(safe-area-inset-top)) 56px 15px;border-bottom:3px solid var(--ink);background:rgba(255,253,248,.92)}
  .mascot{position:absolute;left:16px;bottom:10px;width:auto;height:48px;object-fit:contain}
  .school{font-size:11px;letter-spacing:.12em;font-weight:700;color:var(--blue)}
  h1{margin:3px 0 0;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;font-size:27px;letter-spacing:.06em;line-height:1.1}
  h1 span{color:var(--orange);font-size:.86em;margin-left:3px}.theme{font-size:12px;margin-top:4px;font-weight:600;color:var(--muted)}
  .page-title{text-align:center;margin:20px 16px 14px;font-size:23px;letter-spacing:.08em}.page-note{text-align:center;margin:0 20px 18px;color:var(--muted);font-size:12px}
  .message-card{display:grid;grid-template-columns:126px 1fr;gap:14px;margin:0 15px 16px;padding:13px;border:3px solid var(--ink);border-radius:7px;background:rgba(255,255,255,.87);box-shadow:3px 4px 0 rgba(24,52,77,.13)}
  .portrait{display:block;width:120px;height:160px;object-fit:cover;align-self:start;border:2px solid var(--ink);border-radius:4px;background:var(--paper)}
  .role{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:2px 8px;background:#fff;font-size:10px;font-weight:800}.name{margin:8px 0 0;font-size:18px;font-weight:800}.message{margin:9px 0 0;font-size:13px;line-height:1.75;color:#314b5c;white-space:pre-line}
  .cover-link{display:flex;align-items:center;justify-content:center;gap:10px;width:calc(100% - 32px);margin:20px auto calc(24px + env(safe-area-inset-bottom));padding:14px 18px;border:3px solid var(--ink);border-radius:7px;background:var(--cream);box-shadow:4px 4px 0 var(--ink);color:var(--ink);text-decoration:none;font-size:16px;font-weight:800;letter-spacing:.06em}.cover-link:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}.arrow{font-size:21px;line-height:0}
  @media(max-width:360px){.message-card{grid-template-columns:100px 1fr;gap:10px}.portrait{width:94px;height:126px}.name{font-size:16px}}
</style>
</head>
<body>
<main id="app">
  <header class="banner">
    <img class="mascot" src="uk-lion.png" alt="UKライオン">
    <div class="school">宇都宮工業高等学校</div><h1>宇工祭<span>2026</span></h1><div class="theme">〜 唯一無二の瞬間を 〜</div>
  </header>
  <aside class="announcement-bar" aria-label="お知らせ" hidden><span class="announcement-label">お知らせ</span><div class="announcement-window"><span class="announcement-text"></span></div></aside>
  <h2 class="page-title">ごあいさつ</h2>
  <p class="page-note">宇工祭の開催にあたり、皆さまへごあいさつ申し上げます。</p>
  <article class="message-card" data-greeting="principal">
    <img class="portrait" src="no-image.svg" alt="校長の顔写真は準備中">
    <div><span class="role">校長</span><h3 class="name">校長先生</h3><p class="message">校長先生からのごあいさつ文を準備中です。</p></div>
  </article>
  <article class="message-card" data-greeting="fulltime">
    <img class="portrait" src="no-image.svg" alt="全日制生徒会長の顔写真は準備中">
    <div><span class="role">全日制生徒会長</span><h3 class="name">全日制生徒会長</h3><p class="message">全日制生徒会長からのごあいさつ文を準備中です。</p></div>
  </article>
  <article class="message-card" data-greeting="parttime">
    <img class="portrait" src="no-image.svg" alt="定時制生徒会長の顔写真は準備中">
    <div><span class="role">定時制生徒会長</span><h3 class="name">定時制生徒会長</h3><p class="message">定時制生徒会長からのごあいさつ文を準備中です。</p></div>
  </article>
  <a class="cover-link" href="index.html"><span class="arrow" aria-hidden="true">←</span> 表紙へ戻る</a>
</main>
<script type="module" src="announcement.js"></script>
<script type="module" src="greeting.js"></script>
</body>
</html>
