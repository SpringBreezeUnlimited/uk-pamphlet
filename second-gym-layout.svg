  <rect class="zone" x="520" y="319" width="310" height="161" fill="#fff0d7"/>
  <text class="name" x="675" y="400">写真部</text>
  <rect class="zone" x="520" y="498" width="310" height="161" fill="#fff0d7"/>
  <text class="name" x="675" y="579">書道部</text>

  <rect class="zone" x="904" y="319" width="230" height="216" fill="#e6f3eb"/>
  <text class="name" x="1019" y="427">サッカー部</text>
  <rect class="zone" x="884" y="570" width="250" height="89" fill="#e6f3eb"/>
