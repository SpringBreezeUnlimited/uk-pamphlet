  <rect class="zone" x="922" y="105" width="213" height="136" fill="#e7f1fb"/>
  <text class="name small" x="1028" y="173">環境建設システム系</text>

  <rect class="zone" x="66" y="290" width="182" height="167" fill="#f3eafa"/>
  <text class="name small" x="157" y="374">電子機械研究部</text>
  <rect class="zone" x="66" y="492" width="182" height="167" fill="#f3eafa"/>
  <text class="name small" x="157" y="560"><tspan x="157">生産システム</tspan><tspan x="157" dy="33">研究部</tspan></text>

  <rect class="zone" x="360" y="319" width="160" height="340" fill="#fff0d7"/>
