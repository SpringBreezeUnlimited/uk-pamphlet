<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#142e43">
  <meta name="robots" content="noindex,nofollow">
  <title>普通教室棟の混雑状況｜宇工祭2026</title>
  <link rel="stylesheet" href="monitor.css?v=20261013-classroom">
</head>
<body>
  <main class="screen">
    <header class="topbar">
      <div class="brand"><span>宇工祭 2026</span><strong>普通教室棟の混雑状況</strong></div>
      <div id="connection" class="connection" role="status" aria-live="polite">混雑状況を確認しています…</div>
      <button id="fullscreen" class="control fullscreen" type="button">全画面表示</button>
    </header>
    <div class="intro">
      <div><span class="eyebrow">1階から3階をひと目で確認</span><h1>教室棟の立体案内</h1></div>
      <p>中庭側から見た配置イメージ · 左が正門側、右が体育館側</p>
    </div>
    <div class="main-layout">
      <section class="building-panel" aria-label="教室棟の1階から3階までの配置">
        <div class="orientation"><span>← 正門側</span><span>体育館側 →</span></div>
        <div class="building">
          <div class="roof"><span>普通教室棟</span></div>
          <div id="floor-stack" class="floor-stack"></div>
          <div class="ground"><span>正門・昇降口から</span><strong>中庭側</strong></div>
        </div>
        <div class="legend" aria-label="混雑状況の凡例">
          <span class="quiet">空き</span><span class="moderate">やや混雑</span><span class="busy">混雑</span><span class="closed">終了</span><span class="unknown">要確認・情報なし</span>
        </div>
      </section>
      <section class="detail-panel" aria-labelledby="detail-title">
        <div class="detail-heading"><div><span class="eyebrow">選択中の階の催事</span><h2 id="detail-title">1階</h2></div><p id="detail-summary"></p></div>
        <div id="detail-cards" class="detail-cards"></div>
      </section>
    </div>
    <footer class="toolbar">
      <div id="floor-tabs" class="floor-tabs" aria-label="表示する階"></div>
      <div class="page-controls">
        <button id="previous" class="control arrow" type="button" aria-label="前の階">‹</button>
        <button id="toggle-auto" class="control auto-control" type="button">自動切替を停止</button>
        <button id="next" class="control arrow" type="button" aria-label="次の階">›</button>
      </div>
      <span class="cycle-note">階段は各階の同じ位置にあります</span>
    </footer>
  </main>
  <script src="map-local-data.js"></script>
  <script src="monitor.js?v=20261013-classroom"></script>
</body>
</html>
