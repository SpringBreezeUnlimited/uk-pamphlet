<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#18344d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="宇工祭2026" />
    <title>宇工祭2026 催事一覧・試作版</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="crowd.css" />
    <link rel="stylesheet" href="announcement.css" />
    <link rel="icon" href="lion-favicon.ico" type="image/x-icon">
    <style>
      :root {
        --ink: #18344d;
        --blue: #306486;
        --orange: #e8793b;
        --cream: #fffdf8;
        --paper: #f4ecd9;
        --line: #d7c7aa;
        --muted: #617384;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--paper);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP",
          "Yu Gothic", sans-serif;
      }
      body {
        background-image: linear-gradient(
          rgba(97, 115, 132, 0.09) 1px,
          transparent 1px
        );
        background-size: 100% 30px;
      }
      #app {
        width: min(100%, 680px);
        min-height: 100dvh;
        margin: auto;
        background: rgba(255, 253, 248, 0.8);
        border-inline: 1px solid rgba(215, 199, 170, 0.55);
      }
      .banner {
        position: relative;
        text-align: center;
        padding: calc(18px + env(safe-area-inset-top)) 56px 15px;
        border-bottom: 3px solid var(--ink);
        background: rgba(255, 253, 248, 0.92);
      }
      .mascot {
        position: absolute;
        left: 16px;
        bottom: 10px;
        width: auto;
        height: 48px;
        object-fit: contain;
      }
      .school {
        font-size: 11px;
        letter-spacing: 0.12em;
        font-weight: 700;
        color: var(--blue);
      }
      h1 {
        margin: 3px 0 0;
        font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
        font-size: 27px;
        letter-spacing: 0.06em;
        line-height: 1.1;
      }
      h1 span {
        color: var(--orange);
        font-size: 0.86em;
        margin-left: 3px;
      }
      .theme {
        font-size: 12px;
        margin-top: 4px;
        font-weight: 600;
        color: var(--muted);
      }
      .intro {
        padding: 11px 18px 8px;
        font-size: 12px;
        text-align: center;
        color: var(--muted);
      }
      .data-status {
        margin: -3px 18px 10px;
        text-align: center;
        color: var(--muted);
        font-size: 11px;
      }
      .data-status.error { color: #a33e35; font-weight: 700; }
      .search-panel {
        margin: 0 15px 16px;
        padding: 13px;
        border: 3px solid var(--ink);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 3px 4px 0 rgba(24, 52, 77, 0.13);
      }
      .search-panel h2 { margin: 0 0 9px; font-size: 16px; }
      .search-input {
        width: 100%; padding: 10px 12px; border: 2px solid var(--ink);
        border-radius: 5px; background: var(--cream); color: var(--ink);
        font: 14px inherit;
      }
      .category-filters { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
      .category-filter {
        appearance: none; padding: 7px 10px; border: 2px solid var(--ink);
        border-radius: 999px; background: var(--cream); color: var(--ink);
        font: 700 12px inherit; cursor: pointer;
      }
      .category-filter.active { background: #443088; color: #fff; }
      .event-category {
        display: inline-block; margin-top: 7px; padding: 2px 7px;
        border-radius: 999px; background: #eee9fa; color: #443088;
        font-size: 10px; font-weight: 800;
      }
      .building {
        margin: 0 15px 16px;
        border: 3px solid var(--ink);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 3px 4px 0 rgba(24, 52, 77, 0.13);
      }
      .building-head {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px 12px 8px;
        border-bottom: 2px solid var(--ink);
      }
      .building-head svg {
        height: 34px;
        width: 34px;
        flex: none;
      }
      .building-head strong {
        font-size: 16px;
      }
      .building-head span {
        font-size: 11px;
        color: var(--muted);
      }
      .floor {
        display: grid;
        grid-template-columns: 1fr;
        border-bottom: 2px solid var(--ink);
      }
      .floor:last-child {
        border-bottom: 0;
      }
      .floor-label {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 10px 12px 0;
        font-weight: 800;
        font-size: 17px;
      }
      .floor-label small {
        font-size: 12px;
        color: var(--muted);
        font-weight: 600;
      }
      .room-position-bar {
        display: flex;
        gap: 2px;
        margin: 10px 12px 0;
        padding: 3px;
        border: 2px solid var(--ink);
        border-radius: 8px;
        background: #e8edf2;
      }
      .room-position {
        flex: 1 1 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-width: 0;
        min-height: 56px;
        padding: 0;
        border: 0;
        border-radius: 4px;
        background: #fffdf8;
        color: var(--ink);
        font-family: inherit;
        font-size: 11px;
        font-weight: 800;
        line-height: 1;
        cursor: pointer;
      }
      .position-lion {
        display: none;
        width: 25px;
        height: 31px;
        object-fit: contain;
      }
      .stair-marker {
        flex: 0 0 18px;
        display: grid;
        place-items: center;
        color: var(--ink);
      }
      .stair-marker svg { width: 16px; height: 16px; }
      .room-position.selected {
        background: #fff2bd;
        box-shadow: inset 0 0 0 2px var(--orange);
      }
      .room-position.selected .position-lion { display: block; }
      .room-position:disabled { opacity: 0.4; cursor: default; }
      .room-position:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
      .rooms {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        padding: 10px 12px 12px;
      }
      .room-btn {
        appearance: none;
        border: 2px solid var(--ink);
        border-radius: 8px;
        background: #fffdf8;
        color: var(--ink);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 5px;
        padding: 10px;
        min-height: 88px;
        font: inherit;
        text-align: left;
        cursor: pointer;
        transition:
          0.15s transform,
          0.15s background,
          0.15s color;
        overflow-wrap: anywhere;
      }
      .room-label { font-size: 13px; font-weight: 800; line-height: 1.35; }
      .room-event { font-size: 12px; line-height: 1.4; color: var(--muted); }
      .room-btn.selected .room-event { color: #fff; }
      .room-btn > .crowd-badge {
        display: inline-block;
        margin: auto 0 0;
        padding: 2px 6px;
        font-size: 10px;
        writing-mode: horizontal-tb;
      }
      .room-btn:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
      .room-btn:active {
        transform: scale(0.95);
      }
      .room-btn.selected {
        background: var(--orange);
        color: white;
        box-shadow: 2px 2px 0 var(--ink);
      }
      .facilities {
        display: grid;
        grid-template-columns: 69px 1fr 1fr;
        margin: 0 15px 15px;
        min-height: 82px;
        border: 3px solid var(--ink);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: 3px 4px 0 rgba(24, 52, 77, 0.13);
        overflow: hidden;
      }
      .facility-label {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-right: 2px solid var(--ink);
        font-size: 14px;
        font-weight: 800;
        line-height: 1.25;
      }
      .facility-label small {
        margin-top: 4px;
        font-size: 9px;
        font-weight: 600;
        color: var(--muted);
      }
      .facility {
        border: 0;
        border-right: 2px solid var(--ink);
        border-radius: 0;
        background: #fffdf8;
        color: var(--ink);
        font: 800 13px/1.3 inherit;
        cursor: pointer;
        transition:
          0.15s transform,
          0.15s background;
        padding: 8px;
      }
      .facility:last-child {
        border-right: 0;
      }
      .facility:active {
        transform: scale(0.97);
      }
      .facility.selected {
        background: #e9b94f;
      }
      .detail {
        position: fixed;
        z-index: 20;
        left: 50%;
        bottom: 0;
        width: min(100%, 680px);
        max-height: 55dvh;
        margin: 0;
        padding: 0 15px calc(16px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        overflow-y: auto;
        border-top: 3px solid var(--ink);
        background: rgba(255, 253, 248, 0.96);
        box-shadow: 0 -5px 16px rgba(24, 52, 77, 0.2);
      }
      #app { padding-bottom: 55dvh; }
      .detail-title {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 11px 2px 8px;
      }
      .detail-title .tag {
        border: 2px solid var(--ink);
        border-radius: 999px;
        padding: 2px 8px;
        font-size: 10px;
        font-weight: 800;
        background: #fff;
      }
      .detail-title h2 {
        font-size: 17px;
        margin: 0;
        min-width: 0;
        flex: 1;
      }
      .detail-title p {
        font-size: 11px;
        color: var(--muted);
        margin: 0;
        flex: none;
      }
      .search-close {
        flex: none;
        padding: 5px 9px;
        border: 2px solid var(--ink);
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
        font: 700 12px inherit;
        cursor: pointer;
      }
      .search-close[hidden] { display: none; }
      .search-close:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
      .gym-detail-link {
        display: block;
        margin: 12px 0 4px;
        padding: 12px 14px;
        border: 2px solid var(--ink);
        border-radius: 5px;
        background: var(--cream);
        color: var(--ink);
        font-size: 14px;
        font-weight: 800;
        text-align: center;
        text-decoration: none;
      }
      .gym-detail-link:focus-visible {
        outline: 3px solid var(--orange);
        outline-offset: 2px;
      }
      .cover-link {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: calc(100% - 32px);
        margin: 20px auto calc(24px + env(safe-area-inset-bottom));
        padding: 14px 18px;
        border: 3px solid var(--ink);
        border-radius: 7px;
        background: #fffdf8;
        box-shadow: 4px 4px 0 var(--ink);
        color: var(--ink);
        text-decoration: none;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 0.06em;
      }
      .cover-link:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 var(--ink);
      }
      .cover-link .arrow {
        font-size: 21px;
        line-height: 0;
      }
      #eventList {
        border: 2px solid var(--ink);
        border-radius: 5px;
        background: rgba(255, 255, 255, 0.88);
        min-height: 130px;
        overflow: hidden;
      }
      .empty {
        padding: 34px 16px;
        text-align: center;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.7;
      }
      .event {
        padding: 13px 14px;
        border-bottom: 1px dashed var(--line);
      }
      .event:last-child {
        border-bottom: 0;
      }
      .event-top {
        display: flex;
        gap: 8px;
        align-items: baseline;
        justify-content: space-between;
      }
      .event-name {
        font-size: 16px;
        font-weight: 800;
      }
      .event-time {
        font-size: 11px;
        color: var(--orange);
        font-weight: 800;
        white-space: nowrap;
      }
      .event-room {
        font-size: 11px;
        color: var(--muted);
        margin-top: 3px;
      }
      .event-desc {
        font-size: 13px;
        line-height: 1.55;
        margin-top: 5px;
      }
      .event-image {
        display: block;
        width: min(62%, 260px);
        aspect-ratio: 16/9;
        object-fit: cover;
        margin: 12px auto 4px;
        border: 1px dashed var(--line);
        border-radius: 4px;
        background: var(--paper);
      }
      @media (min-width: 520px) {
        .rooms { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      }
    </style>
  </head>
  <body>
  <main id="app">
      <header class="banner">
        <img class="mascot" src="uk-lion.png" alt="UKライオン" />
        <div class="school">宇都宮工業高等学校</div>
        <h1>宇工祭<span>2026</span></h1>
        <div class="theme">〜 唯一無二の瞬間を 〜</div>
      </header>
      <aside class="announcement-bar" aria-label="お知らせ" hidden><span class="announcement-label">お知らせ</span><div class="announcement-window"><span class="announcement-text"></span></div></aside>
      <div class="intro">
        見たい教室・会場をタップすると、下に催し物の詳細が表示されます。
      </div>
      <p id="dataStatus" class="data-status" aria-live="polite">催事データを読み込んでいます…</p>
      <p id="crowdConnection" class="crowd-note" role="status">混雑状況を確認しています…</p>
      <section class="search-panel" aria-labelledby="searchTitle">
        <h2 id="searchTitle">催事をさがす</h2>
        <input id="eventSearch" class="search-input" type="search" placeholder="催事名・会場・キーワードで検索" autocomplete="off" />
        <div class="category-filters" aria-label="カテゴリで絞り込み">
          <button class="category-filter active" type="button" data-category="">すべて</button>
          <button class="category-filter" type="button" data-category="飲食">飲食</button>
          <button class="category-filter" type="button" data-category="遊ぶ・体験">遊ぶ・体験</button>
          <button class="category-filter" type="button" data-category="展示・ステージ">展示・ステージ</button>
          <button class="category-filter" type="button" data-category="団体・案内">団体・案内</button>
        </div>
      </section>
      <section class="building" aria-label="校舎・教室一覧">
        <div class="building-head">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <path
              d="M13 26 32 10l19 16v28H13z"
              fill="#fffdf8"
              stroke="#18344d"
              stroke-width="3"
            />
            <path
              d="M8 27 32 7l24 20"
              fill="none"
              stroke="#18344d"
              stroke-width="3"
              stroke-linejoin="round"
            />
            <path
              d="M25 54V38h14v16M20 30h5m14 0h5"
              stroke="#306486"
              stroke-width="3"
            />
          </svg>
          <div><strong>校舎（教室棟）</strong><span>　教室を選択</span></div>
        </div>
        <div id="floors"></div>
      </section>
      <section class="facilities" aria-label="体育館一覧">
        <div class="facility-label">体育館<small>会場選択</small></div>
        <button class="facility" data-zone="gymA">第1体育館</button
        ><button class="facility" data-zone="gymB">第2体育館</button>
      </section>
      <section class="building" aria-label="管理棟・中庭の催事一覧">
        <div class="building-head">
          <div><strong>管理棟・中庭</strong><span>　団体を選択</span></div>
        </div>
        <div id="activityZones"></div>
      </section>
    <section class="detail" id="detail" aria-label="選択した催し物の詳細">
        <div class="detail-title">
          <span class="tag" id="detailTag">案内</span>
          <h2 id="detailTitle">催し物を選んでください</h2>
          <p id="detailMeta"></p>
          <button class="search-close" id="searchClose" type="button" aria-label="検索結果を閉じる" hidden>閉じる</button>
        </div>
        <div id="eventList">
          <div class="empty">
            上の教室または体育館をタップすると、<br />ここに催し物の詳細が表示されます。
          </div>
        </div>
      </section>
      <a class="cover-link" href="index.html"
        ><span class="arrow" aria-hidden="true">←</span> 表紙へ戻る</a
      >
    </main>

            { name: "音楽部" },
            { name: "PTA総務委員会" },
            { name: "PTA本部役員" },
            { name: "定時制生徒会" },
            { name: "定時制普通科工業技術科" },
            { name: "普通科２年" },
            { name: "工業技術科２年" },
            { name: "工業技術科３年" },
            { name: "全日制生徒会" },
            { name: "購買部" },
          ],
        },
      };
      let EVENTS = {};
      const floors = document.getElementById("floors"),
        activityZones = document.getElementById("activityZones"),
        eventList = document.getElementById("eventList"),
        detail = document.querySelector(".detail"),
        detailTitle = document.getElementById("detailTitle"),
        detailTag = document.getElementById("detailTag"),
        detailMeta = document.getElementById("detailMeta"),
        searchClose = document.getElementById("searchClose"),
        eventSearch = document.getElementById("eventSearch"),
        dataStatus = document.getElementById("dataStatus");
      let activeCategory = "";
      async function loadEvents(resetSelection = false) {
        EVENTS = FALLBACK_EVENTS;
        let revision = null;
        try {
          const {loadEventsData} = await import("./event-data.js");
          const {data: loaded, source, revision: loadedRevision, warning} = await loadEventsData();
          if (!loaded || typeof loaded !== "object") throw new Error("データ形式が正しくありません");
          EVENTS = loaded;
          revision = loadedRevision;
          const count = Object.values(EVENTS).reduce((total, zone) => total + (zone.items || []).length, 0);
          dataStatus.classList.toggle("error", Boolean(warning));
          dataStatus.textContent = warning
            ? `公開データを取得できないため予備の催事データを表示しています（${count}件）。通信とFirestoreの設定を確認してください。`
            : `${source === "firestore" ? "最新の催事データ" : "予備の催事データ"}を読み込みました（${count}件）`;
        } catch (e) {
          dataStatus.textContent = "催事データを読み込めなかったため、予備データを表示しています。";
          dataStatus.classList.add("error");
        }
        renderFloors();
        renderActivityZones();
        document.querySelectorAll(".facility").forEach((button) => {
          const items = EVENTS[button.dataset.zone]?.items || [];
          button.textContent = [...new Set(items.map(buttonLabel).filter(Boolean))].join("・");
          items.filter(item => item.id).forEach(item => {
            const status = document.createElement("span");
            status.dataset.crowdId = item.id;
            appendCrowdPlaceholder(status);
            button.append(status);
          });
        });
        if (eventSearch.value || activeCategory) searchEvents();
        else if (resetSelection) {
          activate(null);
          showGuide();
        }
        return revision;
      }
      function renderFloors() {
        floors.replaceChildren();
        [
          ["3f", "3F", "1年生"],
          ["2f", "2F", "2年生"],
          ["1f", "1F", "3年生"],
        ].forEach(([id, label, grade]) => {
          const data = EVENTS[id] || { items: [] },
            row = document.createElement("div");
          row.className = "floor";
          row.dataset.zone = id;
          row.innerHTML = `<div class="floor-label">${label}<small>${grade}</small></div><div class="room-position-bar" role="group" aria-label="${label}の教室番号"></div><div class="rooms"></div>`;
          const positionBar = row.querySelector(".room-position-bar");
          positionBar.append(stairMarker());
          for (let index = 0; index < 8; index++) {
            if (index === 6) positionBar.append(stairMarker());
            const number = Number(id[0]) * 100 + index + 1;
            const position = document.createElement("button");
            position.type = "button";
            position.className = "room-position";
            const lion = document.createElement("img");
            lion.className = "position-lion";
            lion.src = "uk-lion.png";
            lion.alt = "";
            lion.setAttribute("aria-hidden", "true");
            const numberLabel = document.createElement("span");
            numberLabel.textContent = number;
            position.append(lion, numberLabel);
            position.setAttribute("aria-label", `${number}教室の催事を表示`);
            position.setAttribute("aria-pressed", "false");
            position.disabled = !data.items[index];
            position.addEventListener("click", () => selectRoom(id, index));
            positionBar.append(position);
          }
          const roomBox = row.querySelector(".rooms");
          data.items.forEach((item, index) => {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "room-btn";
            fillRoomButton(b, item);
            if (item.id && item.name !== "（なし）") b.dataset.crowdId = item.id;
            b.title = item.name;
            b.addEventListener("click", () => selectRoom(id, index));
            roomBox.appendChild(b);
          });
          floors.appendChild(row);
        });
      }
      function stairMarker() {
        const marker = document.createElement("span");
        marker.className = "stair-marker";
        marker.setAttribute("role", "img");
        marker.setAttribute("aria-label", "階段");
        marker.title = "階段";
        marker.innerHTML = '<svg viewBox="0 0 28 28" aria-hidden="true"><path d="M2 24h6v-6h6v-6h6V6h6" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        return marker;
      }
      function buttonLabel(item) {
        return item.room || item.name || "催事";
      }
      function fillRoomButton(button, item) {
        const room = document.createElement("span");
        room.className = "room-label";
        room.textContent = buttonLabel(item);
        button.append(room);
        if (item.name && item.name !== buttonLabel(item)) {
          const name = document.createElement("span");
          name.className = "room-event";
          name.textContent = item.name;
          button.append(name);
        }
        if (item.id && item.name !== "（なし）") appendCrowdPlaceholder(button);
      }
      function appendCrowdPlaceholder(target) {
        const badge = document.createElement("span");
        badge.className = "crowd-badge";
        badge.textContent = "情報なし";
        badge.title = "混雑状況を取得できません";
        target.append(badge);
      }
      function renderActivityZones() {
        activityZones.replaceChildren();
        [
          ["admin", "管理棟"],
          ["courtyard", "中庭"],
        ].forEach(([id, label]) => {
          const data = EVENTS[id] || { items: [] },
            row = document.createElement("div");
          row.className = "floor";
          row.dataset.zone = id;
          row.innerHTML = `<div class="floor-label">${label}<small>団体</small></div><div class="rooms"></div>`;
          const roomBox = row.querySelector(".rooms");
          data.items.forEach((item, index) => {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "room-btn";
            fillRoomButton(b, item);
            if (item.id && item.name !== "（なし）") b.dataset.crowdId = item.id;
            b.title = item.name;
            b.addEventListener("click", () => selectRoom(id, index));
            roomBox.appendChild(b);
          });
          activityZones.appendChild(row);
        });
      }
      function activate(button) {
        document
          .querySelectorAll(".selected")
          .forEach((el) => el.classList.remove("selected"));
        document.querySelectorAll('.room-position[aria-pressed="true"]').forEach((el) =>
          el.setAttribute("aria-pressed", "false"),
        );
        if (button) button.classList.add("selected");
      }
      function selectRoom(zone, index) {
        activate(null);
        const row = document.querySelector(`.floor[data-zone="${zone}"]`);
        row.querySelectorAll(".room-btn")[index]?.classList.add("selected");
        const position = row.querySelectorAll(".room-position")[index];
        position?.classList.add("selected");
        position?.setAttribute("aria-pressed", "true");
        const data = EVENTS[zone],
          item = data.items[index];
        show(data.label + " " + item.name, data.building, item);
        detail.scrollTop = 0;
      }
      function selectZone(zone, button) {
        activate(button);
        const data = EVENTS[zone];
        show(data.label, data.building, null, data.items || [], zone);
        detail.scrollTop = 0;
      }
      function eventImage(ev) {
        const source = typeof ev.image === "string" && /^data:image\/(?:jpeg|png|webp);base64,[a-z\d+/=]+$/i.test(ev.image)
          ? ev.image : "";
        return source ? `<img class="event-image" src="${source}" alt="${escapeHTML(ev.name)}の写真" loading="lazy">` : "";
      }
      function show(title, tag, item, items, zone) {
        searchClose.hidden = true;
        detailTitle.textContent = title;
        detailTag.textContent = tag;
        const list = items || (item ? [item] : []);
        detailMeta.textContent = list.length > 1 ? `${list.length}件` : "";
        eventList.innerHTML = list.length
          ? list
              .map(
                (ev) =>
                  `<article class="event"${ev.id && ev.name !== "（なし）" ? ` data-crowd-id="${escapeHTML(ev.id)}"` : ""}><div class="event-top"><div class="event-name">${escapeHTML(ev.name)}</div>${ev.time ? `<div class="event-time">${escapeHTML(ev.time)}</div>` : ""}</div>${ev.room ? `<div class="event-room">${escapeHTML(ev.room)}</div>` : ""}${ev.desc ? `<div class="event-desc">${escapeHTML(ev.desc)}</div>` : ""}${eventImage(ev)}</article>`,
              )
              .join("")
          : '<div class="empty">この会場の催し物は準備中です。</div>';
        if (zone === "gymA" || zone === "gymB") {
          const link = document.createElement("a");
          link.className = "gym-detail-link";
          link.href = "taiikukan.html";
          link.textContent = "詳細はこちら！";
          eventList.appendChild(link);
        }
        detail.scrollTop = 0;
      }
      function searchEvents() {
        activate(null);
        const query = eventSearch.value.trim().toLocaleLowerCase("ja");
        const results = Object.entries(EVENTS).flatMap(([zone, data]) =>
          (data.items || []).map((item) => ({
            ...item,
            zoneLabel: data.label || zone,
            building: data.building || "",
            category: item.category || "団体・案内",
          })),
        ).filter((item) => {
          if (!item.name || item.name === "（なし）") return false;
          const text = [item.name, item.room, item.time, item.desc, item.zoneLabel, item.building, item.category]
            .join(" ").toLocaleLowerCase("ja");
          return (!activeCategory || item.category === activeCategory) && (!query || text.includes(query));
        });
        const label = [activeCategory, query && `「${eventSearch.value.trim()}」`].filter(Boolean).join("・");
        detailTitle.textContent = label ? `${label} の検索結果` : "すべての催事";
        detailTag.textContent = "検索";
        detailMeta.textContent = `${results.length}件`;
        searchClose.hidden = false;
        eventList.innerHTML = results.length ? results.map((item) =>
          `<article class="event"${item.id ? ` data-crowd-id="${escapeHTML(item.id)}"` : ""}><div class="event-top"><div class="event-name">${escapeHTML(item.name)}</div>${item.time ? `<div class="event-time">${escapeHTML(item.time)}</div>` : ""}</div><div class="event-room">${escapeHTML([item.zoneLabel, item.room].filter(Boolean).join(" · "))}</div><span class="event-category">${escapeHTML(item.category)}</span>${item.desc ? `<div class="event-desc">${escapeHTML(item.desc)}</div>` : ""}${eventImage(item)}</article>`,
        ).join("") : '<div class="empty">条件に合う催事は見つかりませんでした。</div>';
        detail.scrollTop = 0;
      }
      function showGuide() {
        detailTitle.textContent = "催し物を選んでください";
        detailTag.textContent = "案内";
        detailMeta.textContent = "";
        searchClose.hidden = true;
        eventList.innerHTML = '<div class="empty">教室または体育館をタップすると、ここに催し物の詳細が表示されます。</div>';
        detail.scrollTop = 0;
      }
      searchClose.addEventListener("click", () => {
        eventSearch.value = "";
        activeCategory = "";
        document.querySelectorAll(".category-filter").forEach((button) =>
          button.classList.toggle("active", button.dataset.category === ""),
        );
        activate(null);
        showGuide();
      });
      function escapeHTML(s) {
        return String(s || "").replace(
          /[&<>'"]/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              "'": "&#39;",
              '"': "&quot;",
            })[c],
        );
      }
      document
        .querySelectorAll(".facility")
        .forEach((b) =>
          b.addEventListener("click", () => selectZone(b.dataset.zone, b)),
        );
      eventSearch.addEventListener("input", searchEvents);
      document.querySelectorAll(".category-filter").forEach((button) =>
        button.addEventListener("click", () => {
          activeCategory = button.dataset.category;
          document.querySelectorAll(".category-filter").forEach((el) => el.classList.toggle("active", el === button));
          searchEvents();
        }),
      );
      loadEvents().then(async revision => {
        try {
          const {watchEventsVersion} = await import("./event-data.js");
          watchEventsVersion(() => loadEvents(true), revision);
        } catch {}
      });
      if ("serviceWorker" in navigator)
        window.addEventListener("load", () =>
          navigator.serviceWorker.register("sw.js").catch(() => {}),
        );
    </script>
    <script type="module" src="crowd-view.js"></script>
    <script type="module" src="announcement.js"></script>
  </body>
</html>
