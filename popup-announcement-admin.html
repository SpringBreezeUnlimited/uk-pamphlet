<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#18344d">
  <title>ポップアップのお知らせを設定｜宇工祭</title>
  <style>
    :root{--ink:#18344d;--purple:#443088;--paper:#f4ecd9;--muted:#526577}
    *{box-sizing:border-box}[hidden]{display:none!important}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.6}
    main{width:min(100%,850px);min-height:100dvh;margin:auto;padding:32px 18px 54px;background:#fffdf8}
    .eyebrow{margin:0 0 5px;color:var(--purple);font-size:13px;font-weight:800;letter-spacing:.08em}
    h1{margin:0 0 8px;font-size:clamp(25px,5vw,34px)}.lead{color:var(--muted);margin:0 0 24px}
    .status{padding:13px 15px;border-left:4px solid var(--purple);background:#f0ecf7;border-radius:5px;margin:0 0 22px}.status.error{border-color:#b13838;background:#fff1ee}
    .card{background:#fff;border:1px solid #d7c7aa;border-radius:10px;padding:22px;margin-bottom:20px;box-shadow:2px 3px 0 #d7c7aa}
    label{display:block;font-weight:700;margin-bottom:8px}textarea{display:block;width:100%;min-height:160px;padding:12px;border:1.5px solid var(--ink);border-radius:5px;font:inherit;resize:vertical}
    .option{display:flex;align-items:center;gap:10px;margin:18px 0 8px}.option input{flex:none;width:20px;height:20px;margin:0;accent-color:var(--purple)}
    .hint{font-size:13px;color:var(--muted);margin:8px 0 18px}
    button{min-height:46px;padding:10px 17px;border:2px solid var(--purple);border-radius:5px;background:var(--purple);color:#fff;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:wait}
    a{color:var(--purple)}button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid #397cad;outline-offset:3px}.back{display:inline-block;margin-top:12px;font-weight:700}
  </style>
</head>
<body>
<main>
  <p class="eyebrow">宇工祭 · 生徒会役員用</p>
  <h1>ポップアップのお知らせを設定</h1>
  <p class="lead">表紙のメニューに到達した後に表示するお知らせを設定します。流れるお知らせとは別の内容です。</p>
  <p id="status" class="status" role="status" aria-live="polite">管理者権限を確認しています…</p>
  <section id="editor" class="card" hidden>
    <form id="popupAnnouncementForm">
      <label for="message">お知らせの内容</label>
      <textarea id="message" maxlength="600" placeholder="例：本日の受付は正門からお入りください。"></textarea>
      <p class="hint">600文字まで。改行もポップアップに反映されます。</p>
      <label class="option" for="enabled"><input id="enabled" type="checkbox">ポップアップを表示する</label>
      <p class="hint">オンにすると、表紙のメニューに到達した後に一度表示します。オフにしても文章は保存されます。</p>
      <button id="save" type="submit">ポップアップのお知らせを保存</button>
    </form>
  </section>
  <a class="back" href="admin.html">← 管理者トップに戻る</a>
</main>
<script type="module">
  import("./popup-announcement-admin.js").catch(() => {
    const status = document.getElementById("status");
    status.textContent = "管理画面を読み込めません。通信を確認して再読み込みしてください。";
    status.classList.add("error");
  });
</script>
</body>
</html>
